[package]
name = "mcp-iot"
version = "1.0.0"
edition = "2021"
description = "MCP server for IoT device management — telemetry, commands, alerts, digital twins, fleet management, OTA updates, geofencing"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-iot"
keywords = ["mcp", "iot", "telemetry", "mqtt", "digital-twin"]
categories = ["network-programming"]

[[bin]]
name = "mcp-iot"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
adk-mcp-sdk = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[workspace]
