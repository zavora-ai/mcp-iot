[package]
name = "mcp-iot"
version = "1.1.0"
edition = "2021"
rust-version = "1.94.1"
description = "MCP server for IoT device management — telemetry, commands, alerts, digital twins, fleet management, OTA updates, geofencing"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-iot"
keywords = ["mcp", "iot", "telemetry", "mqtt", "digital-twin"]
categories = ["network-programming"]

[[bin]]
name = "mcp-iot"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
adk-mcp-sdk = { version = "0.2.0", git = "https://github.com/zavora-ai/adk-mcp-sdk.git", rev = "4dac4301441a8a51a042fd66cc1798f0ec3e3f55" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[workspace]
