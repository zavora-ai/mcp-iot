<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <rect width="900" height="520" fill="#0f172a" rx="12"/>
  <text x="450" y="30" text-anchor="middle" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="15" font-weight="bold">mcp-iot v1.0.0 - IoT Device Management Engine (22 tools)</text>

  <rect x="20" y="48" width="110" height="50" fill="#1e293b" stroke="#6366f1" stroke-width="2" rx="8"/>
  <text x="75" y="70" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="10" font-weight="bold">AI Agent</text>
  <text x="75" y="85" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="8">MCP Client</text>

  <line x1="130" y1="73" x2="165" y2="73" stroke="#6366f1" stroke-width="2"/>
  <polygon points="165,69 175,73 165,77" fill="#6366f1"/>

  <rect x="180" y="43" width="700" height="60" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" rx="8"/>
  <text x="530" y="62" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Tool Router - 22 Tools</text>

  <rect x="195" y="72" width="55" height="15" fill="#4c1d95" rx="3"/>
  <text x="222" y="83" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="7">Devices</text>
  <rect x="255" y="72" width="60" height="15" fill="#4c1d95" rx="3"/>
  <text x="285" y="83" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="7">Telemetry</text>
  <rect x="320" y="72" width="60" height="15" fill="#4c1d95" rx="3"/>
  <text x="350" y="83" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="7">Commands</text>
  <rect x="385" y="72" width="45" height="15" fill="#b45309" rx="3"/>
  <text x="407" y="83" text-anchor="middle" fill="#fef3c7" font-family="Arial,sans-serif" font-size="7">Alerts</text>
  <rect x="435" y="72" width="45" height="15" fill="#4c1d95" rx="3"/>
  <text x="457" y="83" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="7">Twins</text>
  <rect x="485" y="72" width="45" height="15" fill="#4c1d95" rx="3"/>
  <text x="507" y="83" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="7">Fleets</text>
  <rect x="535" y="72" width="40" height="15" fill="#4c1d95" rx="3"/>
  <text x="555" y="83" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="7">OTA</text>
  <rect x="580" y="72" width="60" height="15" fill="#4c1d95" rx="3"/>
  <text x="610" y="83" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="7">Geofence</text>

  <!-- Telemetry Flow -->
  <rect x="20" y="120" width="860" height="80" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="450" y="140" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Telemetry Pipeline (auto-alert on ingest)</text>

  <rect x="40" y="150" width="100" height="30" fill="#064e3b" stroke="#10b981" stroke-width="1" rx="4"/>
  <text x="90" y="169" text-anchor="middle" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="8">Device Sends</text>
  <rect x="160" y="150" width="100" height="30" fill="#064e3b" stroke="#10b981" stroke-width="1" rx="4"/>
  <text x="210" y="169" text-anchor="middle" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="8">Ingest Metrics</text>
  <rect x="280" y="150" width="100" height="30" fill="#064e3b" stroke="#10b981" stroke-width="1" rx="4"/>
  <text x="330" y="169" text-anchor="middle" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="8">Eval Rules</text>
  <rect x="400" y="150" width="100" height="30" fill="#78350f" stroke="#f59e0b" stroke-width="1" rx="4"/>
  <text x="450" y="169" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="8">Trigger Alert</text>
  <rect x="520" y="150" width="100" height="30" fill="#064e3b" stroke="#10b981" stroke-width="1" rx="4"/>
  <text x="570" y="169" text-anchor="middle" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="8">Update Twin</text>
  <rect x="640" y="150" width="100" height="30" fill="#064e3b" stroke="#10b981" stroke-width="1" rx="4"/>
  <text x="690" y="169" text-anchor="middle" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="8">Store History</text>

  <line x1="140" y1="165" x2="160" y2="165" stroke="#10b981" stroke-width="1.5"/>
  <line x1="260" y1="165" x2="280" y2="165" stroke="#10b981" stroke-width="1.5"/>
  <line x1="380" y1="165" x2="400" y2="165" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="500" y1="165" x2="520" y2="165" stroke="#10b981" stroke-width="1.5"/>
  <line x1="620" y1="165" x2="640" y2="165" stroke="#10b981" stroke-width="1.5"/>

  <!-- Digital Twin -->
  <rect x="20" y="215" width="420" height="90" fill="#1e293b" stroke="#06b6d4" stroke-width="2" rx="8"/>
  <text x="230" y="235" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Digital Twin - Drift Detection</text>
  <rect x="40" y="250" width="120" height="35" fill="#164e63" stroke="#06b6d4" stroke-width="1" rx="4"/>
  <text x="100" y="265" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="8" font-weight="bold">Reported State</text>
  <text x="100" y="278" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="7">From device telemetry</text>
  <rect x="180" y="250" width="120" height="35" fill="#164e63" stroke="#06b6d4" stroke-width="1" rx="4"/>
  <text x="240" y="265" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="8" font-weight="bold">Desired State</text>
  <text x="240" y="278" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="7">Set by agent</text>
  <rect x="320" y="250" width="100" height="35" fill="#78350f" stroke="#f59e0b" stroke-width="1" rx="4"/>
  <text x="370" y="265" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="8" font-weight="bold">Drift Keys</text>
  <text x="370" y="278" text-anchor="middle" fill="#fde68a" font-family="Arial,sans-serif" font-size="7">reported != desired</text>

  <!-- Fleet + OTA -->
  <rect x="460" y="215" width="420" height="90" fill="#1e293b" stroke="#ec4899" stroke-width="2" rx="8"/>
  <text x="670" y="235" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Fleet Management and OTA</text>
  <text x="480" y="258" fill="#f9a8d4" font-family="Arial,sans-serif" font-size="8">Fleet groups for bulk operations</text>
  <text x="480" y="273" fill="#f9a8d4" font-family="Arial,sans-serif" font-size="8">Send commands to all devices in fleet</text>
  <text x="480" y="288" fill="#f9a8d4" font-family="Arial,sans-serif" font-size="8">OTA firmware versioning and rollout tracking</text>

  <!-- Geofencing -->
  <rect x="20" y="320" width="420" height="80" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="230" y="340" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Geofencing - Haversine Breach Detection</text>
  <text x="40" y="365" fill="#fde68a" font-family="Arial,sans-serif" font-size="8">Circular geofences (lat, lng, radius_m)</text>
  <text x="40" y="380" fill="#fde68a" font-family="Arial,sans-serif" font-size="8">Haversine formula for accurate distance on Earth</text>
  <text x="40" y="395" fill="#fde68a" font-family="Arial,sans-serif" font-size="8">Reports: inside/outside, distance, breach status per fence</text>

  <!-- Data Store -->
  <rect x="460" y="320" width="420" height="80" fill="#1e293b" stroke="#475569" stroke-width="2" rx="8"/>
  <text x="670" y="340" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="10" font-weight="bold">In-Memory Data Store</text>
  <rect x="475" y="355" width="55" height="16" fill="#164e63" rx="3"/>
  <text x="502" y="366" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="7">Devices</text>
  <rect x="535" y="355" width="60" height="16" fill="#164e63" rx="3"/>
  <text x="565" y="366" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="7">Telemetry</text>
  <rect x="600" y="355" width="55" height="16" fill="#164e63" rx="3"/>
  <text x="627" y="366" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="7">Alerts</text>
  <rect x="660" y="355" width="45" height="16" fill="#164e63" rx="3"/>
  <text x="682" y="366" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="7">Twins</text>
  <rect x="710" y="355" width="45" height="16" fill="#164e63" rx="3"/>
  <text x="732" y="366" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="7">Fleets</text>
  <rect x="760" y="355" width="55" height="16" fill="#164e63" rx="3"/>
  <text x="787" y="366" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="7">Firmware</text>
  <rect x="820" y="355" width="50" height="16" fill="#164e63" rx="3"/>
  <text x="845" y="366" text-anchor="middle" fill="#67e8f9" font-family="Arial,sans-serif" font-size="7">Fences</text>

  <!-- Comparison -->
  <rect x="20" y="420" width="860" height="85" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/>
  <text x="450" y="442" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="10" font-weight="bold">vs Cloud IoT Platforms</text>
  <text x="130" y="468" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">AWS IoT Core</text>
  <text x="320" y="468" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">Azure IoT Hub</text>
  <text x="500" y="468" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="9">GCP IoT Core (deprecated)</text>
  <text x="730" y="468" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="9" font-weight="bold">mcp-iot: Free, Open Source</text>
  <text x="730" y="488" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="8">Zero config, no cloud lock-in</text>
</svg>
